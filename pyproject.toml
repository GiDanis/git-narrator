[project]
name = "git-narrator"
version = "0.1.0"
description = "Understand any git diff in 5 seconds. AI-powered narrative walkthrough and risk radar for human and agentic code."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "git-narrator contributors" }
]
keywords = [
    "git",
    "git-diff",
    "ai",
    "developer-tools",
    "cli",
    "ollama",
    "gemini",
    "code-review",
    "pr",
    "conventional-commits"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
]

[project.scripts]
git-narrator = "git_narrator.cli:main"
narrator = "git_narrator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
